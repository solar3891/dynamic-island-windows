<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="100%" height="100%" style="background: #000000; border-radius: 16px; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <!-- Background Vignette -->
    <radialGradient id="bgGlow" cx="50%" cy="10%" r="80%">
      <stop offset="0%" stop-color="#181824" />
      <stop offset="100%" stop-color="#050508" />
    </radialGradient>

    <!-- Album Art Gradient -->
    <linearGradient id="albumArt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fa2d48" />
      <stop offset="100%" stop-color="#99152b" />
    </linearGradient>

    <!-- Ring Gradients -->
    <linearGradient id="cpuGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="ramGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38ef7d" />
      <stop offset="100%" stop-color="#11998e" />
    </linearGradient>
    <linearGradient id="batGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6d365" />
      <stop offset="100%" stop-color="#fda085" />
    </linearGradient>

    <!-- Island Drop Shadow -->
    <filter id="islandShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.8" />
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#ffffff" flood-opacity="0.08" />
    </filter>
  </defs>

  <style>
    /* Continuous Fluid Keyframe Animations */
    @keyframes islandMorph {
      0%, 25% {
        x: 275px;
        y: 16px;
        width: 250px;
        height: 38px;
        rx: 19px;
      }
      35%, 85% {
        x: 190px;
        y: 16px;
        width: 420px;
        height: 250px;
        rx: 34px;
      }
      95%, 100% {
        x: 275px;
        y: 16px;
        width: 250px;
        height: 38px;
        rx: 19px;
      }
    }

    @keyframes compactFade {
      0%, 25% { opacity: 1; transform: translateY(0); }
      30%, 88% { opacity: 0; transform: translateY(-8px); }
      95%, 100% { opacity: 1; transform: translateY(0); }
    }

    @keyframes expandedFade {
      0%, 28% { opacity: 0; transform: translateY(12px) scale(0.96); pointer-events: none; }
      36%, 82% { opacity: 1; transform: translateY(0) scale(1); }
      90%, 100% { opacity: 0; transform: translateY(12px) scale(0.96); pointer-events: none; }
    }

    @keyframes eqWave1 { 0%, 100% { height: 4px; } 50% { height: 14px; } }
    @keyframes eqWave2 { 0%, 100% { height: 15px; } 50% { height: 6px; } }
    @keyframes eqWave3 { 0%, 100% { height: 8px; } 50% { height: 16px; } }

    @keyframes ringPulse {
      0% { stroke-dashoffset: 60; }
      50% { stroke-dashoffset: 35; }
      100% { stroke-dashoffset: 60; }
    }

    .island-body {
      animation: islandMorph 9s cubic-bezier(0.16, 1, 0.3, 1) infinite;
    }
    .compact-content {
      animation: compactFade 9s cubic-bezier(0.16, 1, 0.3, 1) infinite;
    }
    .expanded-content {
      animation: expandedFade 9s cubic-bezier(0.16, 1, 0.3, 1) infinite;
    }
    .wave-1 { animation: eqWave1 0.75s ease-in-out infinite; }
    .wave-2 { animation: eqWave2 0.6s ease-in-out infinite 0.15s; }
    .wave-3 { animation: eqWave3 0.8s ease-in-out infinite 0.3s; }
    .cpu-stroke { animation: ringPulse 4s ease-in-out infinite; }
  </style>

  <!-- Background Desktop Simulation -->
  <rect width="800" height="360" fill="url(#bgGlow)" />
  <line x1="0" y1="0" x2="800" y2="0" stroke="rgba(255,255,255,0.15)" stroke-width="1" />

  <!-- Animated Morphing Dynamic Island Body -->
  <rect class="island-body" x="275" y="16" width="250" height="38" rx="19" fill="#0c0c0e" stroke="rgba(255,255,255,0.14)" stroke-width="1.2" filter="url(#islandShadow)" />

  <!-- 1. COMPACT PILL STATE CONTENT -->
  <g class="compact-content" transform="translate(285, 23)">
    <!-- Small Album Thumbnail -->
    <rect x="2" y="2" width="20" height="20" rx="6" fill="url(#albumArt)" />
    <polygon points="10,8 16,12 10,16" fill="#ffffff" />
    
    <!-- Title Ticker Text -->
    <text x="32" y="16" fill="#f5f5f7" font-size="11" font-weight="600" letter-spacing="-0.2px">Windows Dynamic Island</text>

    <!-- Equalizer Waves -->
    <g transform="translate(208, 17) scale(1, -1)">
      <rect class="wave-1" x="0" y="0" width="2.5" height="12" rx="1.2" fill="#fa2d48" />
      <rect class="wave-2" x="5" y="0" width="2.5" height="16" rx="1.2" fill="#fa2d48" />
      <rect class="wave-3" x="10" y="0" width="2.5" height="8" rx="1.2" fill="#fa2d48" />
    </g>
  </g>

  <!-- 2. EXPANDED CONTROL CENTER STATE CONTENT -->
  <g class="expanded-content" transform="translate(206, 28)">
    <!-- Top Music Bar -->
    <rect x="0" y="0" width="388" height="52" rx="14" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <rect x="8" y="7" width="38" height="38" rx="9" fill="url(#albumArt)" />
    <polygon points="23,19 33,26 23,33" fill="#ffffff" />

    <text x="56" y="24" fill="#ffffff" font-size="13" font-weight="600" letter-spacing="-0.3px">Fluid Spring Animation</text>
    <text x="56" y="39" fill="#86868b" font-size="11" font-weight="400">120 FPS Native Win32 Core</text>

    <!-- Mini Controls -->
    <g transform="translate(305, 18)" fill="#ffffff">
      <!-- Previous -->
      <polygon points="10,4 2,9 10,14" opacity="0.8" />
      <rect x="0" y="4" width="2" height="10" opacity="0.8" />
      <!-- Pause -->
      <circle cx="28" cy="9" r="12" fill="#ffffff" />
      <rect x="25" y="5" width="2.5" height="8" rx="1" fill="#000000" />
      <rect x="29" y="5" width="2.5" height="8" rx="1" fill="#000000" />
      <!-- Next -->
      <polygon points="46,4 54,9 46,14" opacity="0.8" />
      <rect x="54" y="4" width="2" height="10" opacity="0.8" />
    </g>

    <!-- Center Modules Grid -->
    <!-- Module A: Activity Rings Card -->
    <rect x="0" y="62" width="188" height="112" rx="16" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <text x="14" y="82" fill="#86868b" font-size="11" font-weight="500">SYSTEM HEALTH</text>

    <!-- Concentric Rings -->
    <g transform="translate(48, 126)">
      <!-- Outer Ring: CPU -->
      <circle cx="0" cy="0" r="28" fill="none" stroke="rgba(0, 242, 254, 0.2)" stroke-width="5.5" />
      <circle class="cpu-stroke" cx="0" cy="0" r="28" fill="none" stroke="url(#cpuGrad)" stroke-width="5.5" stroke-linecap="round" stroke-dasharray="175" stroke-dashoffset="45" transform="rotate(-90)" />

      <!-- Middle Ring: RAM -->
      <circle cx="0" cy="0" r="20" fill="none" stroke="rgba(56, 239, 125, 0.2)" stroke-width="5.5" />
      <circle cx="0" cy="0" r="20" fill="none" stroke="url(#ramGrad)" stroke-width="5.5" stroke-linecap="round" stroke-dasharray="125" stroke-dashoffset="40" transform="rotate(-90)" />

      <!-- Inner Ring: Battery -->
      <circle cx="0" cy="0" r="12" fill="none" stroke="rgba(254, 160, 133, 0.2)" stroke-width="5.5" />
      <circle cx="0" cy="0" r="12" fill="none" stroke="url(#batGrad)" stroke-width="5.5" stroke-linecap="round" stroke-dasharray="75" stroke-dashoffset="15" transform="rotate(-90)" />
    </g>

    <!-- Ring Legend -->
    <g transform="translate(95, 102)" font-size="11" font-weight="600">
      <circle cx="6" cy="6" r="3.5" fill="#00f2fe" />
      <text x="16" y="10" fill="#ffffff">CPU 34%</text>

      <circle cx="6" cy="24" r="3.5" fill="#38ef7d" />
      <text x="16" y="28" fill="#ffffff">RAM 58%</text>

      <circle cx="6" cy="42" r="3.5" fill="#fda085" />
      <text x="16" y="46" fill="#ffffff">PWR 100%</text>
    </g>

    <!-- Module B: Master Volume Slider -->
    <rect x="198" y="62" width="190" height="112" rx="16" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <text x="212" y="82" fill="#86868b" font-size="11" font-weight="500">MASTER VOLUME</text>
    <text x="356" y="82" fill="#ffffff" font-size="12" font-weight="700">68%</text>

    <!-- Interactive Capsule Slider Bar -->
    <rect x="212" y="100" width="162" height="32" rx="16" fill="rgba(255,255,255,0.12)" />
    <rect x="212" y="100" width="112" height="32" rx="16" fill="#ffffff" />
    <circle cx="230" cy="116" r="7" fill="#000000" opacity="0.8" />
    <text x="246" y="120" fill="#000000" font-size="11" font-weight="600">Realtek Audio</text>

    <!-- Bottom Quick Action Chips -->
    <g transform="translate(0, 186)" font-size="11" font-weight="500">
      <!-- Battery Status Chip -->
      <rect x="0" y="0" width="118" height="28" rx="14" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
      <circle cx="16" cy="14" r="4" fill="#38ef7d" />
      <text x="26" y="18" fill="#f5f5f7">100% Connected</text>

      <!-- Focus Timer Chip -->
      <rect x="126" y="0" width="118" height="28" rx="14" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
      <text x="144" y="18" fill="#f5f5f7">25m Focus Session</text>

      <!-- Clipboard Chip -->
      <rect x="252" y="0" width="136" height="28" rx="14" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
      <text x="270" y="18" fill="#f5f5f7">Smart Clipboard Sync</text>
    </g>
  </g>

  <!-- Bottom Title Caption -->
  <text x="400" y="325" fill="#86868b" font-size="12" font-weight="500" text-anchor="middle" letter-spacing="0.5px">FLUID ISLAND DYNAMICS • APPLE HIG SPRING PHYSICS • WIN32 NATIVE</text>
</svg>
